<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed HTML Code Encryptor</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        :root {
            --bg-primary: #17181a;
            --bg-secondary: #202225;
            --bg-tertiary: #2c2f33;
            --bg-code: #0e0f10;
            --text-primary: #f0f2f5;
            --text-secondary: #a8b3cf;
            --accent-color: #82aaff;
            --success-color: #2e7d32;
            --border-color: #3a3d42;
            --font-main: 'Inter', sans-serif;
            --font-code: 'Roboto Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--text-primary);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .info-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--bg-tertiary);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card h3 {
            font-size: 1rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .radio-group {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
        }

        .radio-label {
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
        }
        
        .radio-label:hover { color: var(--text-primary); }
        .radio-label input { accent-color: var(--accent-color); transform: scale(1.1); }

        .editor-area {
            margin-bottom: 20px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--bg-code);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-code);
            padding: 15px;
            resize: vertical;
            font-size: 14px;
        }

        textarea:focus { border-color: var(--accent-color); }

        .toolbar {
            display: flex;
            gap: 10px;
            background-color: var(--bg-tertiary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            min-width: 140px;
            font-size: 0.9rem;
            color: white;
        }

        .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); }
        .btn-secondary:hover { background-color: var(--bg-code); color: var(--text-primary); }

        .btn-primary { background-color: var(--accent-color); color: #17181a; }
        .btn-primary:hover { opacity: 0.9; }

        .btn-decrypt { background-color: #c792ea; color: #17181a; }
        .btn-decrypt:hover { opacity: 0.9; }

        .btn-copy { 
            width: 100%; 
            margin-top: 10px; 
            background-color: var(--success-color);
        }
        .btn-copy:hover { opacity: 0.9; }
        
        /* Success state for copy button */
        .btn-copied {
            background-color: #43a047 !important;
            color: white !important;
        }

        @media (max-width: 700px) {
            .info-section { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1><span class="material-symbols-outlined" style="font-size: 30px;">lock_person</span> Code Encryptor</h1>
        </header>

        <div class="info-section">
            <div class="card">
                <h3><span class="material-symbols-outlined">lock</span> Encode HTML</h3>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="enctype" checked onclick="setFullEnc(false)"> Basic
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="enctype" onclick="setFullEnc(true)"> Full Hex
                    </label>
                </div>
            </div>
            <div class="card">
                <h3><span class="material-symbols-outlined">lock_open</span> Decode HTML</h3>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">Paste encrypted code below to decrypt.</p>
            </div>
        </div>

        <!-- INPUT -->
        <div class="editor-area">
            <div class="editor-header">
                <span>INPUT CODE</span>
                <span id="topSize">0 chars</span>
            </div>
            <textarea id="InputArea" placeholder="Paste your HTML code here..."></textarea>
        </div>

        <!-- BUTTONS -->
        <div class="toolbar">
            <button onclick="Preview(0)" class="btn-secondary">
                <span class="material-symbols-outlined">visibility</span> Preview Input
            </button>
            <button onclick="Encrypt()" class="btn-primary">
                <span class="material-symbols-outlined">lock</span> Encode
            </button>
            <button onclick="Decrypt()" class="btn-decrypt">
                <span class="material-symbols-outlined">no_encryption</span> Decode
            </button>
            <button onclick="Preview(1)" class="btn-secondary">
                <span class="material-symbols-outlined">visibility</span> Preview Output
            </button>
        </div>

        <!-- OUTPUT -->
        <div class="editor-area">
            <div class="editor-header">
                <span>OUTPUT CODE</span>
                <span id="bottomSize">0 chars</span>
            </div>
            <textarea id="OutputArea" readonly placeholder="Result will appear here..."></textarea>
            
            <!-- FIXED: Passed 'this' to handle button click correctly -->
            <button onclick="copyOutput(this)" class="btn-copy">
                <span class="material-symbols-outlined">content_copy</span> Select & Copy Output
            </button>
        </div>

        <footer style="text-align: center; font-size: 0.8rem; color: #666; margin-top: 20px;">
            Secure HTML Encryption Tool
        </footer>
    </div>

    <!-- JAVASCRIPT FIXED FOR ALL BUTTONS -->
    <script>
        var quot = "'";
        var fullenc = false;

        // --- 1. SETTINGS ---
        function setFullEnc(value) {
            fullenc = value;
        }

        // --- 2. ENCRYPT FUNCTION ---
        function Encrypt() {
            var input = document.getElementById('InputArea').value;
            if(!input) { alert("Please enter some code first!"); return; }

            var NewCode = "";
            
            if (fullenc) {
                // Full Encoding Logic
                for (var i = 0; i < input.length; i++) {
                    NewCode += Hex(input.charCodeAt(i));
                }
            } else {
                // Basic Encoding Logic
                NewCode = escape(input);
            }

            // Wrapper
            NewCode = '<' + 'script language=javascript>document.write(unescape(' + quot + NewCode + quot + '))<' + '/script>\n';
            
            document.getElementById('OutputArea').value = NewCode;
            FileSizes();
        }

        // --- 3. DECRYPT FUNCTION ---
        function Decrypt() {
            var input = document.getElementById('InputArea').value;
            if(!input) { alert("Please enter encrypted code first!"); return; }

            var NewCode = unescape(input);
            
            // Clean up the script tags to get raw HTML back
            NewCode = NewCode.replace("<script language=javascript>document.write(unescape('", "");
            NewCode = NewCode.replace("'))<" + "/script>", "");
            
            document.getElementById('OutputArea').value = NewCode;
            FileSizes();
        }

        // --- 4. HEX HELPER ---
        function Hex(dec) {
            var hexbase = "0123456789ABCDEF";
            var hx_hi = Math.floor(dec / 16);
            var hx_lo = dec % 16;
            return "%" + hexbase.charAt(hx_hi) + hexbase.charAt(hx_lo);
        }

        // --- 5. CHAR COUNTER ---
        function FileSizes() {
            document.getElementById('topSize').innerText = document.getElementById('InputArea').value.length + ' chars';
            document.getElementById('bottomSize').innerText = document.getElementById('OutputArea').value.length + ' chars';
        }

        // --- 6. PREVIEW FUNCTION (FIXED) ---
        function Preview(selection) {
            FileSizes();
            var content = (selection == 0) ? document.getElementById('InputArea').value : document.getElementById('OutputArea').value;
            
            if (!content) { alert("Nothing to preview!"); return; }

            var w = window.open("", "_blank", "width=600,height=400,resizable=yes,scrollbars=yes");
            
            if (w) {
                w.document.open();
                w.document.write("<html><head><title>Preview</title></head><body style='font-family:Arial; padding:20px;'>");
                w.document.write("<h2>Preview Mode</h2><hr>");
                w.document.write(content);
                w.document.write("<hr><br><button onclick='window.close()' style='padding:10px; cursor:pointer;'>Close Window</button>");
                w.document.write("</body></html>");
                w.document.close(); // IMPORTANT: This fixes the infinite loading spinner
            } else {
                alert("Popup blocked! Please allow popups for this site.");
            }
        }

        // --- 7. COPY FUNCTION (FIXED) ---
        function copyOutput(btn) {
            var output = document.getElementById('OutputArea');
            
            if (!output.value) return;

            // Select text
            output.select();
            output.setSelectionRange(0, 99999); // Mobile support

            // Copy to clipboard
            try {
                navigator.clipboard.writeText(output.value).then(function() {
                    showCopiedFeedback(btn);
                });
            } catch (err) {
                // Fallback for older browsers
                document.execCommand('copy');
                showCopiedFeedback(btn);
            }
        }

        function showCopiedFeedback(btn) {
            var originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Code Copied!';
            btn.classList.add('btn-copied');
            
            setTimeout(function() {
                btn.innerHTML = originalText;
                btn.classList.remove('btn-copied');
            }, 2000);
        }

        // Listeners
        document.getElementById('InputArea').addEventListener('input', FileSizes);
        document.getElementById('OutputArea').addEventListener('input', FileSizes);
    </script>
</body>
</html>
